<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモン図鑑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">ポケモン図鑑</h1>
      <div class="search-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="名前 or 番号で検索…" autocomplete="off" />
        <button class="search-btn" id="search-btn">検索</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- ランダムボタン -->
    <div class="random-bar">
      <button class="btn-random" id="btn-random">ランダム表示</button>
    </div>

    <!-- カード -->
    <div class="card" id="card">
      <!-- ローディング -->
      <div class="loading" id="loading">
        <div class="pokeball-spin"></div>
        <p>読み込み中…</p>
      </div>

      <!-- エラー -->
      <div class="error hidden" id="error">
        <p id="error-msg">ポケモンが見つかりません</p>
        <button class="btn-retry" id="btn-retry">もう一度</button>
      </div>

      <!-- ポケモン情報 -->
      <div class="pokemon-view hidden" id="pokemon-view">
        <div class="poke-header">
          <span class="poke-number" id="poke-number">#001</span>
          <h2 class="poke-name" id="poke-name">フシギダネ</h2>
          <div class="poke-types" id="poke-types"></div>
        </div>

        <div class="poke-body">
          <div class="poke-image-wrap">
            <img class="poke-image" id="poke-image" src="" alt="" />
          </div>

          <div class="poke-info">
            <div class="info-row">
              <span class="info-label">高さ</span>
              <span class="info-value" id="poke-height">—</span>
            </div>
            <div class="info-row">
              <span class="info-label">重さ</span>
              <span class="info-value" id="poke-weight">—</span>
            </div>
            <div class="info-row">
              <span class="info-label">特性</span>
              <span class="info-value" id="poke-abilities">—</span>
            </div>
          </div>
        </div>

        <div class="stats-section">
          <h3 class="stats-title">基本ステータス</h3>
          <div class="stats-list" id="stats-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
